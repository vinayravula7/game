spring.application.name=game

# Render dynamically assigns a port
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# SendGrid Configuration (Bypasses SMTP port blocking)
sendgrid.api.key=${SENDGRID_API_KEY}
# This matches the verified sender you created in SendGrid
spring.mail.username=${MAIL_USERNAME}

# Logging Levels (Keep these to see the SendGrid success/error logs)
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=INFO

# Custom JWT Property
jwt.secret=${JWT_SECRET}

# Database Pooling
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
