spring.application.name=game

# Render dynamically assigns a port. This ensures Spring listens to it.
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Email Configuration (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- CRITICAL FOR DEBUGGING ON RENDER ---
# This prints the SMTP handshake (connection details) in your logs
spring.mail.properties.mail.debug=true

# Logging Levels
# DEBUG level for your own code to see the logs we just added
logging.level.com.example.demo=DEBUG
# INFO level for Spring Security to check for 403/Forbidden issues
logging.level.org.springframework.security=INFO

# Custom JWT Property
jwt.secret=${JWT_SECRET}

# Database Pooling
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
